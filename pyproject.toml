[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-dcf-setup"
version = "0.1.0"
description = "Local AI-driven historical company initiation with source checks and Excel models"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "pypdf[crypto]==6.20.0", "xlrd==2.0.2", "fonttools==4.67.0"]

[project.optional-dependencies]
ibkr = ["ib_async==2.1.0"]

[tool.setuptools.packages.find]
where = ["forecasting_engine"]

[tool.research-platform]
fx-source = "data_store/FX/FX model.xlsx"
fx-database = "data_store/FX/fx.sqlite"
cheap-review-repairs = 1

[tool.research-platform.ibkr]
host = "127.0.0.1"
port = 7496
client-id = 71
session-timezone = "Europe/London"
overlap-days = 7
max-recent-days = 90
pairs = ["EUR/USD", "USD/CHF", "GBP/USD", "USD/JPY", "USD/CAD", "AUD/USD", "USD/MXN", "USD/CNH", "USD/SGD", "USD/HKD", "USD/SEK", "USD/NOK", "USD/PLN", "USD/ZAR"]

